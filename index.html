<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축구 전술 승률 시뮬레이터</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b1117;
    color:white;
    font-family:Arial,"Malgun Gothic",sans-serif;
}

header{
    height:70px;
    background:#151d26;
    border-bottom:1px solid #303b47;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.match{
    display:flex;
    align-items:center;
    gap:14px;
    font-weight:bold;
}

.home-name{color:#4da3ff}
.away-name{color:#ff6173}

.container{
    max-width:1500px;
    margin:auto;
    padding:24px;
    display:grid;
    grid-template-columns:minmax(600px,1fr) 380px;
    gap:24px;
}

/* 제목 */

.title h1{
    margin:0;
    font-size:25px;
}

.title p{
    color:#929eaa;
    font-size:14px;
    margin:8px 0 16px;
}

/* 경기장 */

.pitch{
    position:relative;
    width:100%;
    aspect-ratio:1.55;
    overflow:hidden;
    border:4px solid white;

    background:
    repeating-linear-gradient(
        90deg,
        #237742 0px,
        #237742 70px,
        #2c8049 70px,
        #2c8049 140px
    );
}

.line{
    position:absolute;
    background:#ffffffd9;
}

.center-line{
    width:3px;
    height:100%;
    left:50%;
    top:0;
}

.center-circle{
    position:absolute;
    width:120px;
    height:120px;
    border:3px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.center-dot{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.penalty{
    position:absolute;
    width:18%;
    height:40%;
    top:30%;
    border:3px solid white;
}

.penalty.left{left:-3px}
.penalty.right{right:-3px}

.goal{
    position:absolute;
    width:4%;
    height:17%;
    top:41.5%;
    border:3px solid white;
}

.goal.left{left:-5px}
.goal.right{right:-5px}

/* 선수 */

.player{
    position:absolute;
    width:75px;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
    cursor:grab;
    user-select:none;
    touch-action:none;
}

.player:active{
    cursor:grabbing;
}

.player-circle{
    width:45px;
    height:45px;
    margin:auto;
    border:3px solid white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    box-shadow:0 4px 10px #0008;
    transition:.15s;
}

.home .player-circle{
    background:#176dcc;
}

.away .player-circle{
    background:#d72e46;
}

.player.selected .player-circle{
    transform:scale(1.18);
    box-shadow:
        0 0 0 4px #ffd43b,
        0 0 20px #ffd43b;
}

.player-name{
    font-size:11px;
    font-weight:bold;
    margin-top:4px;
    white-space:nowrap;
    text-shadow:0 2px 4px #000;
}

/* 범례 */

.legend{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:12px;
    color:#adb8c3;
    font-size:13px;
}

.dot{
    width:13px;
    height:13px;
    display:inline-block;
    border-radius:50%;
    vertical-align:-2px;
    margin-right:5px;
}

.blue{background:#176dcc}
.red{background:#d72e46}

/* 패널 */

.panel{
    background:#151d26;
    border:1px solid #2d3844;
    border-radius:14px;
    padding:20px;
    height:max-content;
}

.panel h2{
    margin:0 0 18px;
}

.section{
    margin-top:18px;
}

.section-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

select{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #3c4855;
    background:#202a34;
    color:white;
    font-size:14px;
}

button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:12px;
    margin-top:9px;
    background:#247bd6;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#368ce5;
}

.gray{
    background:#36414c;
}

.gray:hover{
    background:#46535f;
}

.reset{
    background:#b9344b;
}

.reset:hover{
    background:#d5445b;
}

/* 선수 정보 */

.info{
    background:#202a34;
    border-radius:10px;
    padding:15px;
    min-height:150px;
}

.info-name{
    font-size:22px;
    font-weight:bold;
}

.info-sub{
    color:#9eabb7;
    font-size:13px;
    margin-top:5px;
}

.position{
    display:inline-block;
    margin-top:10px;
    padding:6px 9px;
    background:#303c48;
    color:#ffd43b;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
}

.info-desc{
    color:#adb8c3;
    font-size:12px;
    margin-top:9px;
}

/* 능력치 */

.stat{
    margin-top:8px;
}

.stat-top{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#aab5bf;
}

.bar{
    height:6px;
    background:#303b46;
    border-radius:5px;
    overflow:hidden;
    margin-top:4px;
}

.bar-inner{
    height:100%;
    background:#3d91e6;
}

/* 승률 */

.win-box{
    margin-top:18px;
    background:#10171f;
    border:1px solid #2c3844;
    border-radius:10px;
    padding:15px;
}

.win-title{
    font-weight:bold;
    margin-bottom:12px;
}

.probability{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.prob{
    background:#202a34;
    border-radius:7px;
    padding:9px 3px;
    text-align:center;
    font-size:12px;
}

.prob-number{
    font-size:20px;
    font-weight:bold;
    margin-top:4px;
}

.win{color:#55a9ff}
.draw{color:#ffd35a}
.loss{color:#ff6678}

.score{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
    font-size:18px;
}

.note{
    text-align:center;
    margin-top:6px;
    color:#788591;
    font-size:10px;
}

/* 선수단 */

.roster{
    margin-top:18px;
    background:#10171f;
    border-radius:10px;
    padding:12px;
    max-height:220px;
    overflow:auto;
}

.roster-title{
    font-weight:bold;
    margin-bottom:8px;
}

.roster-item{

    padding:6px 2px;
    font-size:12px;
    color:#cbd3da;
}

.roster-item:last-child{

}

@media(max-width:1000px){

/* =========================================================
   9. 선수 DOM 생성
========================================================= */

function createPlayerElement(player,team,index){

    const el=
        document.createElement("div");

    el.className=
        `player ${team}`;

    el.style.left=
        player.x+"%";

    el.style.top=
        player.y+"%";


    el.innerHTML=`

        <div class="player-circle">
            ${player.no}
        </div>

        <div class="player-name">
            ${player.name}
        </div>

    `;


    el.dataset.team=team;
    el.dataset.index=index;


    pitch.appendChild(el);


    /* 클릭 */

    el.addEventListener("click",function(){

        if(dragged) return;

        document
            .querySelectorAll(".player")
            .forEach(p=>
                p.classList.remove("selected")
            );

        el.classList.add("selected");

        selectedPlayer=player;
        selectedTeam=team;
        selectedIndex=index;

        showPlayerInfo(player,team);

        updateReplacementList();

    });


    /* 드래그 */

    let startX=0;
    let startY=0;

    let moved=false;


    el.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            moved=false;

            const rect=
                el.getBoundingClientRect();

            startX=e.clientX;
            startY=e.clientY;

            el.setPointerCapture(e.pointerId);


            function move(ev){

                const dx=
                    Math.abs(ev.clientX-startX);

                const dy=
                    Math.abs(ev.clientY-startY);

                if(dx>3 || dy>3){
                    moved=true;
                    dragged=true;
                }


                if(!moved) return;


                const pitchRect=
                    pitch.getBoundingClientRect();


                let x=
                    ((ev.clientX-pitchRect.left)
                    /pitchRect.width)*100;


                let y=
                    ((ev.clientY-pitchRect.top)
                    /pitchRect.height)*100;


                x=Math.max(3,Math.min(97,x));
                y=Math.max(5,Math.min(95,y));


                el.style.left=x+"%";
                el.style.top=y+"%";


                player.x=x;
                player.y=y;

            }


            function up(){

                el.removeEventListener(
                    "pointermove",
                    move
                );

                el.removeEventListener(
                    "pointerup",
                    up
                );


                if(moved){

                    setTimeout(()=>{
                        dragged=false;
                    },100);

                }

            }


            el.addEventListener(
                "pointermove",
                move
            );

            el.addEventListener(
                "pointerup",
                up
            );

        }
    );

}

/* =========================================================
   12. 선수 교체
========================================================= */

function replacePlayer(){

    if(!selectedPlayer){

        alert("먼저 대전 선수를 클릭하세요.");

        return;

    }


    if(selectedTeam!=="home"){

        alert("대전 선수만 교체할 수 있습니다.");

        return;

    }


    const value=
        replacementSelect.value;


    if(value===""){

        alert("교체할 선수를 선택하세요.");

        return;

    }


    const newPlayer=
        daejeonRoster.find(
            p=>String(p.no)===String(value)
        );


    if(!newPlayer) return;


    const oldIndex=selectedIndex;


    /*
       이미 선발된 선수라면 위치 교환
    */

    const existingIndex=
        homePlayers.findIndex(
            p=>p.no===newPlayer.no
        );


    if(
        existingIndex!==-1 &&
        existingIndex!==oldIndex
    ){

        const oldX=
            homePlayers[oldIndex].x;

        const oldY=
            homePlayers[oldIndex].y;

        const newX=
            homePlayers[existingIndex].x;

        const newY=
            homePlayers[existingIndex].y;


        homePlayers[oldIndex]={
            ...newPlayer,
            x:newX,
            y:newY
        };


        homePlayers[existingIndex]={
            ...homePlayers[existingIndex],
            x:oldX,
            y:oldY
        };

    }

    else{

        homePlayers[oldIndex]={
            ...newPlayer,
            x:selectedPlayer.x,
            y:selectedPlayer.y
        };

    }


    selectedPlayer=
        homePlayers[oldIndex];


    renderPlayers();


    /*
       교체된 선수 다시 선택
    */

    const newElement=
        document.querySelector(
            `.player.home[data-index="${oldIndex}"]`
        );


    if(newElement){

        newElement.classList.add("selected");

    }


    showPlayerInfo(
        selectedPlayer,
        "home"
    );

    updateReplacementList();


    calculateWinRate();

}

/* =========================================================
   14. 팀 전력 계산
========================================================= */

function teamPower(players){

    if(players.length===0)
        return 0;


    let attack=0;
    let midfield=0;
    let defense=0;
    let goalkeeper=0;


    players.forEach(p=>{

        attack+=p.attack;
        midfield+=p.midfield;
        defense+=p.defense;


        if(p.pos==="GK"){
            goalkeeper+=p.goalkeeping;
        }

    });


    const count=players.length;


    const a=attack/count;
    const m=midfield/count;
    const d=defense/count;

    const g=
        goalkeeper>0
        ? goalkeeper
        : 70;


    return (
        a*0.38+
        m*0.25+
        d*0.25+
        g*0.12
    );

}


/* =========================================================
   15. 전술 보너스
========================================================= */

function tacticalBonus(players,isHome){

    let bonus=0;


    players.forEach(p=>{

        /*
           공격수
        */

        if(p.pos==="FW"){

            if(
                (isHome && p.x>55) ||
                (!isHome && p.x<45)
            ){
                bonus+=2;
            }

        }


        /*
           수비수
        */

        if(p.pos==="DF"){

            if(
                (isHome && p.x<50) ||
                (!isHome && p.x>50)
            ){
                bonus+=1.5;
            }

        }


        /*
           미드필더
        */

        if(p.pos==="MF"){

            const distance=
                Math.abs(p.y-50);

            bonus+=
                Math.max(
                    0,
                    2-distance/25
                );

        }

    });


    return bonus;

}


/* =========================================================
   16. 승률 계산
========================================================= */

function calculateWinRate(){

    const homePower=
        teamPower(homePlayers)
        +
        tacticalBonus(homePlayers,true);


    const awayPower=
        teamPower(awayPlayers)
        +
        tacticalBonus(awayPlayers,false)
        +
        opponents[currentOpponent].strength*0.20;


    const difference=
        homePower-awayPower;


    let win=
        50+difference*1.7;


    win=
        Math.max(
            10,
            Math.min(78,win)
        );


    let draw=
        27-Math.abs(difference)*0.15;


    draw=
        Math.max(
            14,
            Math.min(30,draw)
        );


    let loss=
        100-win-draw;


    if(loss<7){

        loss=7;

        win=100-draw-loss;

    }


    win=Math.round(win);
    draw=Math.round(draw);

    loss=100-win-draw;


    document.getElementById(
        "winPercent"
    ).textContent=win+"%";


    document.getElementById(
        "drawPercent"
    ).textContent=draw+"%";


    document.getElementById(
        "lossPercent"
    ).textContent=loss+"%";


    /*
       예상 득점
    */

    let homeGoals=
        Math.round(
            1.3+(homePower-awayPower)/25
        );


    let awayGoals=
        Math.round(
            1.1+(awayPower-homePower)/30
        );


    homeGoals=
        Math.max(
            0,
            Math.min(5,homeGoals)
        );

    awayGoals=
        Math.max(
            0,
            Math.min(5,awayGoals)
        );


    document.getElementById(
        "score"
    ).textContent=
        `예상 스코어 ${homeGoals} : ${awayGoals}`;

}
